<text x="120" y="285" class="micro">01 / CORE</text>
<text x="120" y="335" class="big">U = SHORT SIDE / 40</text>
<text x="120" y="380" class="body">SHORT SIDE = 40U    /    1U = 2.5%</text>
<text x="120" y="430" class="body">One proportional grammar controls every UNIT001 carrier.</text>
<text x="120" y="460" class="body">No arbitrary local spacing values.</text>
