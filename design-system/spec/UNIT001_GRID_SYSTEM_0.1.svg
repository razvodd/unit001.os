<rect x="120" y="1566" width="96" height="14" fill="#111111"/>
<text x="420" y="1578" class="micro">SPACE/04 = 4U</text>
<rect x="120" y="1608" width="120" height="14" fill="#111111"/>
<text x="420" y="1620" class="micro">SPACE/05 = 5U</text>
<rect x="120" y="1650" width="144" height="14" fill="#111111"/>
<text x="420" y="1662" class="micro">SPACE/06 = 6U</text>
<rect x="120" y="1692" width="192" height="14" fill="#111111"/>
<text x="420" y="1704" class="micro">SPACE/08 = 8U</text>
<rect x="120" y="1734" width="240" height="14" fill="#111111"/>
<text x="420" y="1746" class="micro">SPACE/10 = 10U</text>
<rect x="120" y="1776" width="288" height="14" fill="#111111"/>
<text x="420" y="1788" class="micro">SPACE/12 = 12U</text>
<text x="120" y="1770" class="micro">04 / GLOBAL TOKENS</text>
<text x="120" y="1820" class="title">ONE TOKEN CHANGE / WHOLE SYSTEM UPDATES</text>
<text x="120" y="1880" class="body">U</text>
<text x="120" y="1912" class="body">MARGIN = 5U</text>
<text x="120" y="1944" class="body">COLUMN = 6U</text>
<text x="120" y="1976" class="body">SPACE/01 = 1U</text>
<text x="120" y="2008" class="body">SPACE/02 = 2U</text>
<text x="120" y="2040" class="body">SPACE/03 = 3U</text>
<text x="120" y="2072" class="body">SPACE/04 = 4U</text>
<text x="120" y="2104" class="body">SPACE/05 = 5U</text>
<text x="120" y="2136" class="body">SPACE/06 = 6U</text>
<text x="120" y="2168" class="body">SPACE/08 = 8U</text>
<text x="120" y="2200" class="body">SPACE/10 = 10U</text>
<text x="120" y="2232" class="body">SPACE/12 = 12U</text>
<text x="760" y="1880" class="body">No arbitrary px / mm / local padding.</text>
<text x="760" y="1920" class="body">If a value cannot be derived from existing tokens:</text>
<text x="760" y="1960" class="title">MARK IT TBD.</text>
<text x="120" y="2260" class="micro">05 / CARRIER MODES</text>
<rect x="120" y="2305" width="285" height="170" class="box"/>
<text x="138" y="2340" class="micro">MOBILE / 1080</text>
<text x="138" y="2385" class="title">U = 27</text>
<rect x="440" y="2305" width="285" height="170" class="box"/>
<text x="458" y="2340" class="micro">PHOTO / 5304</text>
<text x="458" y="2385" class="title">U = 132.6</text>
<rect x="760" y="2305" width="285" height="170" class="box"/>
<text x="778" y="2340" class="micro">A4 / 210</text>
<text x="778" y="2385" class="title">U = 5.25</text>
<rect x="1080" y="2305" width="285" height="170" class="box"/>
<text x="1098" y="2340" class="micro">CARD / 60</text>
<text x="1098" y="2385" class="title">U = 1.5</text>
<text x="120" y="2515" class="body">Modes change numerical U values, never proportional relationships.</text>
<text x="120" y="2610" class="micro">06 / TYPE / CANDIDATE</text>
<text x="120" y="2660" class="title">IBM PLEX MONO / REGULAR 400</text>
<text x="120" y="2705" class="body">TYPE SIZE: 0.75U / 1U / 1.25U</text>
<text x="120" y="2740" class="body">LINE: 1U / 1.25U / 1.5U / 2U</text>
<text x="120" y="2785" class="micro">Typography values remain CANDIDATE until visual testing is approved.</text>
<text x="120" y="2870" class="micro">07 / LOCKED</text>
<text x="120" y="2912" class="body">U = SHORT SIDE / 40</text>
<text x="120" y="2942" class="body">5 COLUMNS</text>
<text x="120" y="2972" class="body">MARGIN = 5U</text>
<text x="120" y="3002" class="body">COLUMN = 6U</text>
<text x="120" y="3032" class="body">VERTICAL SPACING = nU</text>
<text x="120" y="3062" class="body">GLOBAL TOKENS / NO LOCAL SPACING</text>
<text x="850" y="2870" class="micro">08 / CANDIDATE</text>
<text x="850" y="2912" class="body">TYPE SIZE</text>
<text x="850" y="2942" class="body">LINE HEIGHT</text>
<text x="850" y="2972" class="body">BASELINE</text>
<text x="850" y="3002" class="body">EXACT SPACING SCALE</text>
<text x="850" y="3032" class="body">INTERNAL PADDING</text>
<line x1="120" y1="3150" x2="1480" y2="3150" class="rule"/>
<text x="120" y="3210" class="micro">SPEC / 0.1</text>
<text x="120" y="3250" class="title">X = GRID    Y = nU    WIDTH = n COLUMNS    SPACING = nU</text>
