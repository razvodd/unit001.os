<text x="240" y="1001" class="micro">IMAGE / 3 COLUMNS</text>
<text x="816" y="760" class="micro">TEXT / 2 COLUMNS</text>
<text x="120" y="1220" class="micro">CONTENT STARTS AND ENDS ON GRID LINES. EMPTY SPACE IS ACTIVE.</text>
<text x="120" y="1290" class="micro">03 / VERTICAL RHYTHM</text>
<text x="120" y="1340" class="title">Y = nU</text>
<text x="120" y="1385" class="body">All major vertical positions and spacing derive from U.</text>
<rect x="120" y="1440" width="24" height="14" fill="#111111"/>
<text x="420" y="1452" class="micro">SPACE/01 = 1U</text>
<rect x="120" y="1482" width="48" height="14" fill="#111111"/>
<text x="420" y="1494" class="micro">SPACE/02 = 2U</text>
<rect x="120" y="1524" width="72" height="14" fill="#111111"/>
